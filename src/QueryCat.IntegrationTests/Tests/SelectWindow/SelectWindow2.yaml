query: |
  select
    row_number() over (partition by city order by balance),
    first_value(name) over (order by name),
    first_value(balance) over (order by name),
    last_value(name) over (order by name),
    last_value(balance) over (order by name)
  from 'Simple2.csv'
  order by name;
